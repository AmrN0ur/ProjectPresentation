[build]
  publish = "."

# Redirect presentation paths to their folders (without trailing slash)
[[redirects]]
  from = "/Buildaxis"
  to = "/presentations/Buildaxis/index.html"
  status = 200

[[redirects]]
  from = "/Buildaxis/*"
  to = "/presentations/Buildaxis/:splat"
  status = 200

[[redirects]]
  from = "/CanteenSystem"
  to = "/presentations/CanteenSystem/index.html"
  status = 200

[[redirects]]
  from = "/CanteenSystem/*"
  to = "/presentations/CanteenSystem/:splat"
  status = 200

[[redirects]]
  from = "/GHO"
  to = "/presentations/GHO/index.html"
  status = 200

[[redirects]]
  from = "/GHO/*"
  to = "/presentations/GHO/:splat"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
