<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeltaBase | منصة العروض التقديمية</title>
    <meta
      name="description"
      content="DeltaBase - منصة العروض التقديمية للمشاريع البرمجية"
    />
    <meta
      name="keywords"
      content="DeltaBase, Software, Presentations, Web Development"
    />
    <meta name="author" content="DeltaBase" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DeltaBase | منصة العروض التقديمية" />
    <meta
      property="og:description"
      content="منصة العروض التقديمية للمشاريع البرمجية"
    />
    <meta property="og:image" content="DeltaBase_Logo.png" />

    <link rel="icon" href="DeltaBase_Logo.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="DeltaBase_Logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Tajawal", sans-serif;
        background: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e293b 50%,
          #0f3d87 100%
        );
        min-height: 100vh;
        color: #fff;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      header {
        text-align: center;
        padding: 3rem 0;
      }

      .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1rem;
      }

      header h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      header p {
        font-size: 1.1rem;
        color: #94a3b8;
        font-weight: 400;
      }

      .presentations-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 2rem;
        padding: 2rem 0;
      }

      .presentation-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 2rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .presentation-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #0f3d87, #0f766e, #c58a11);
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }

      .presentation-card:hover::before {
        transform: scaleX(1);
      }

      .presentation-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .card-thumbnail {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        object-fit: cover;
        background: #fff;
        padding: 5px;
      }

      .card-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #fff;
      }

      .card-description {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.7;
        margin-bottom: 1rem;
      }

      .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .tag {
        background: rgba(15, 61, 135, 0.3);
        color: #60a5fa;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .card-status {
        display: inline-block;
        padding: 0.3rem 0.8rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 1rem;
      }

      .status-active {
        background: rgba(16, 185, 129, 0.2);
        color: #10b981;
      }

      .status-draft {
        background: rgba(245, 158, 11, 0.2);
        color: #f59e0b;
      }

      .card-actions {
        display: flex;
        gap: 1rem;
      }

      .btn {
        flex: 1;
        padding: 0.8rem 1.2rem;
        border: none;
        border-radius: 10px;
        font-family: "Tajawal", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        text-align: center;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0f3d87, #1e40af);
        color: #fff;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #1e40af, #2563eb);
        transform: scale(1.02);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .loading,
      .error,
      .empty {
        text-align: center;
        padding: 4rem 2rem;
        color: #94a3b8;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #0f3d87;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      footer {
        text-align: center;
        padding: 3rem 0;
        color: #64748b;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .presentations-grid {
          grid-template-columns: 1fr;
        }

        header h1 {
          font-size: 1.8rem;
        }

        .card-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img src="DeltaBase_Logo.png" alt="DeltaBase Logo" class="logo" />
        <h1>DeltaBase</h1>
        <p>منصة العروض التقديمية للمشاريع البرمجية</p>
      </header>

      <main id="presentations-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>جاري تحميل العروض...</p>
        </div>
      </main>

      <footer>
        <p>© 2025 DeltaBase Software. جميع الحقوق محفوظة.</p>
      </footer>
    </div>

    <script>
      // التحقق من المسار المباشر
      function checkDirectPath() {
        const path = window.location.pathname;
        const segments = path.split("/").filter((s) => s);

        // إذا كان هناك segment واحد ولا يوجد file extension
        if (segments.length === 1 && !segments[0].includes(".")) {
          const presentationId = segments[0];
          // تحقق من وجود العرض
          fetch("presentations.json")
            .then((r) => r.json())
            .then((data) => {
              const presentation = data.presentations.find(
                (p) => p.id === presentationId,
              );
              if (presentation) {
                window.location.replace(presentation.path);
              }
            });
        }
      }

      // تحميل العروض
      async function loadPresentations() {
        const container = document.getElementById("presentations-container");

        try {
          const response = await fetch("presentations.json");
          if (!response.ok) throw new Error("فشل في تحميل البيانات");

          const data = await response.json();
          const presentations = data.presentations || [];

          if (presentations.length === 0) {
            container.innerHTML = `
                        <div class="empty">
                            <p>لا توجد عروض تقديمية متاحة حالياً</p>
                        </div>
                    `;
            return;
          }

          container.innerHTML = `
                    <div class="presentations-grid">
                        ${presentations
                          .map(
                            (p) => `
                            <div class="presentation-card">
                                <div class="card-header">
                                    <img src="${p.thumbnail}" alt="${p.title}" class="card-thumbnail">
                                    <h2 class="card-title">${p.title}</h2>
                                </div>
                                <span class="card-status status-${p.status}">
                                    ${p.status === "active" ? "نشط" : "مسودة"}
                                </span>
                                <p class="card-description">${p.description}</p>
                                <div class="card-tags">
                                    ${p.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}
                                </div>
                                <div class="card-actions">
                                    <a href="${p.path}" class="btn btn-primary">عرض تقديمي</a>
                                    ${
                                      p.roadmap
                                        ? `
                                        <a href="${p.roadmap}" class="btn btn-secondary">خارطة الطريق</a>
                                    `
                                        : ""
                                    }
                                </div>
                            </div>
                        `,
                          )
                          .join("")}
                    </div>
                `;
        } catch (error) {
          container.innerHTML = `
                    <div class="error">
                        <p>حدث خطأ أثناء تحميل العروض</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</p>
                    </div>
                `;
        }
      }

      // تشغيل
      checkDirectPath();
      loadPresentations();
    </script>
  </body>
</html>
